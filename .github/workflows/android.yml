name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.HEXORA_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_hexoraSigningStorePassword: ${{ secrets.HEXORA_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_hexoraSigningKeyAlias: ${{ secrets.HEXORA_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_hexoraSigningKeyPassword: ${{ secrets.HEXORA_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Configure optional release signing
        if: >-
          env.KEYSTORE_BASE64 != '' &&
          env.ORG_GRADLE_PROJECT_hexoraSigningStorePassword != '' &&
          env.ORG_GRADLE_PROJECT_hexoraSigningKeyAlias != '' &&
          env.ORG_GRADLE_PROJECT_hexoraSigningKeyPassword != ''
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/hexora-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ORG_GRADLE_PROJECT_hexoraSigningStoreFile=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Hexora-debug.apk
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$RELEASE_APK"
          if [[ "$RELEASE_APK" == *unsigned* ]]; then
            cp "$RELEASE_APK" artifacts/Hexora-release-unsigned.apk
          else
            cp "$RELEASE_APK" artifacts/Hexora-release.apk
          fi
          sha256sum artifacts/*.apk

      - name: Upload Hexora debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Hexora-APK-debug
          path: artifacts/Hexora-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Hexora release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Hexora-APK-release
          path: artifacts/Hexora-release*.apk
          if-no-files-found: error
          retention-days: 14
